name: QA BRZ EUA — Supabase integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe JavaScript
        run: |
          set -euo pipefail
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Conferir dados USDA e assets não modificados
        run: |
          set -euo pipefail
          grep -v '  index.html$' docs/SHA256SUMS.txt | sha256sum -c -
      - name: Conferir scripts, CSS e tela de senha
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[];self.css=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'):self.ids.add(d['id'])
                  if tag=='script' and d.get('src'): self.scripts.append(d['src'])
                  if tag=='link' and d.get('rel')=='stylesheet':self.css.append(d['href'])
          h=Path('index.html').read_text(encoding='utf-8')
          p=Check();p.feed(h)
          for ref in p.scripts+p.css:
              assert not ref.startswith(('http:','https:')),ref
              assert Path(ref).is_file(),f'Arquivo ausente: {ref}'
          required=['brz-access-gate','brz-gate-form','brz-gate-password','eua-data','eua-state','brz-i18n']
          assert all(x in p.ids for x in required),set(required)-p.ids
          assert 'js/core/cloud-sync.js' in p.scripts
          assert 'js/core/gate-handler.js' in p.scripts
          assert 'js/core/history-backups.js' in p.scripts
          assert 'js/core/export-adapter.js' in p.scripts
          print(f'OK: {len(p.scripts)} scripts, {len(p.css)} folhas CSS e controles de autenticação.')
          PY
