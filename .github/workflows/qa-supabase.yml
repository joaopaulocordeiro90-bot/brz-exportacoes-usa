name: QA BRZ EUA — Interface independente
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe de JavaScript
        run: |
          set -euo pipefail
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Conferir integridade dos dados USDA e imagens originais
        run: |
          set -euo pipefail
          grep -v -e 'index.html' -e 'js/core/app.js' docs/SHA256SUMS.txt | sha256sum -c -
      - name: Conferir referências e autenticação no HTML
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[];self.css=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'):self.ids.add(d['id'])
                  if tag=='script' and d.get('src'):self.scripts.append(d['src'])
                  if tag=='link' and d.get('rel')=='stylesheet':self.css.append(d['href'])
          h=Path('index.html').read_text(encoding='utf-8')
          p=Check();p.feed(h)
          for ref in p.scripts+p.css:
              assert not ref.startswith(('http:','https:')),ref
              assert Path(ref).is_file(),f'Arquivo ausente: {ref}'
          required=['brz-access-gate','brz-gate-form','brz-gate-password','eua-data','eua-state','brz-i18n']
          assert all(x in p.ids for x in required),set(required)-p.ids
          for f in ['js/core/gate-handler.js','js/core/export-adapter.js']:
              assert f in p.scripts
          print(f'OK: {len(p.scripts)} scripts, {len(p.css)} folhas CSS e autenticação.')
          PY
      - name: Testar senha, sincronização e exportação autocontida no Chromium
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/brz-eua-http.log 2>&1 &
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
          node tools/qa_static_smoke.mjs
          node tools/qa_version_rebase.mjs
